name: Verify and release both platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synchronized-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: playwright-report
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run release:check
      - run: npm run desktop:build
      - name: Verify native startup in a disposable Windows profile
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Prepare versioned artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts | Out-Null
          Copy-Item src-tauri/target/release/classpilot.exe artifacts/ClassPilot-Windows-Portable.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/
          Copy-Item dist/build-info.json artifacts/windows-build-info.json
          Get-ChildItem artifacts -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/

  stage-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts
      - name: Stage desktop download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "ClassPilot $RELEASE_TAG" --notes "网页与 Windows 来自同一提交。下载 ClassPilot-Windows-Portable.exe 双击运行。SHA256SUMS.txt 提供文件校验。"
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber

  pages:
    needs: stage-release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

  publish:
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the matching Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
