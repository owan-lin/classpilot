[package]
name = "classpilot"
version = "0.2.4"
description = "ClassPilot offline-first classroom seating manager"
authors = ["Owan Lin"]
edition = "2021"

[lib]
name = "classpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
